name: Build Mayx Cloud Gaming App & Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD ANDROID CLIENT (.APK)
  # ==========================================
  build-apk:
    name: Build Android Client APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Upgrade Android Project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.mayx .

      # Thêm quyền Internet & WebRTC vào AndroidManifest.xml để tránh văng app
      - name: Inject Android Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              
              <application
                  android:label="Mayx Cloud Gaming"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      # Ép compileSdkVersion = 35 cho TẤT CẢ subprojects
      - name: Force SDK 35 on All Android Plugins
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Android-Client
          path: android/app/build/outputs/apk/release/*.apk

  # ==========================================
  # JOB 2: BUILD WINDOWS CLIENT (.EXE)
  # ==========================================
  build-windows-client:
    name: Build Windows Client EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Client
        run: flutter build windows --release

      - name: Zip Windows Client Release
        shell: powershell
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MayxCloudGaming-Windows-Client.zip" -Force

      - name: Upload Windows Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Windows-Client
          path: MayxCloudGaming-Windows-Client.zip
