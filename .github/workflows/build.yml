name: Build Mayx Cloud Gaming App & Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD ANDROID CLIENT (.APK)
  # ==========================================
  build-apk:
    name: Build Android Client APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android Platform Exists
        run: |
          flutter create . --platforms=android --org com.mayx.cloudgaming || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Android-Client
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # JOB 2: BUILD WINDOWS CLIENT (.EXE)
  # ==========================================
  build-windows-client:
    name: Build Windows Client EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Windows Platform Exists
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --org com.mayx.cloudgaming

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Client
        run: flutter build windows --release

      - name: Zip Windows Client Release
        shell: powershell
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MayxCloudGaming-Windows-Client.zip" -Force

      - name: Upload Windows Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Windows-Client
          path: MayxCloudGaming-Windows-Client.zip

  # ==========================================
  # JOB 3: BUILD WINDOWS SERVER SETUP (.EXE)
  # ==========================================
  build-server-exe:
    name: Build Windows Server Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mss pillow pynput vgamepad customtkinter aiortc av sounddevice numpy

      - name: Create Default App Icon PNG if Missing
        shell: powershell
        run: |
          python -c "
          import os
          if not os.path.exists('app_icon.png'):
              from PIL import Image, ImageDraw
              img = Image.new('RGBA', (512, 512), (15, 23, 42, 255))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle([16, 16, 496, 496], radius=96, fill=(15, 23, 42, 255), outline=(6, 182, 212, 255), width=8)
              draw.ellipse([140, 180, 320, 360], fill=(14, 165, 233, 255))
              draw.ellipse([220, 140, 400, 320], fill=(56, 189, 248, 255))
              draw.rounded_rectangle([120, 280, 390, 380], radius=30, fill=(14, 165, 233, 255))
              draw.rounded_rectangle([160, 310, 352, 410], radius=45, fill=(244, 63, 94, 255))
              img.save('app_icon.png')
          "

      - name: Convert App Icon PNG to ICO
        shell: powershell
        run: |
          python -c "from PIL import Image; img = Image.open('app_icon.png'); img.save('app_icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=app_icon.ico --collect-all customtkinter --name "MayxServer" server.py

      - name: Download & Install Inno Setup Directly
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "inno_setup.exe"
          Start-Process -FilePath "inno_setup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait

      - name: Compile Installer with Inno Setup
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_script.iss

      - name: Upload Windows Server Setup
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Windows-Server-Setup
          path: Output/MayxCloudGaming_Server_Setup.exe
