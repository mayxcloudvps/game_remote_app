name: Build Mayx Cloud Gaming App & Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD ANDROID CLIENT (.APK)
  # ==========================================
  build-apk:
    name: Build Android Client APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Re-generate thư mục Android chuẩn V2 Embedding để xóa sạch vết tích V1
      - name: Re-create Android Project with V2 Embedding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.mayx .

      - name: Configure SDK 35 globally in properties
        run: |
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

          echo "android.compileSdkVersion=35" >> android/gradle.properties
          echo "android.targetSdkVersion=35" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Android-Client
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # JOB 2: BUILD WINDOWS CLIENT (.EXE)
  # ==========================================
  build-windows-client:
    name: Build Windows Client EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Client
        run: flutter build windows --release

      - name: Zip Windows Client Release
        shell: powershell
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MayxCloudGaming-Windows-Client.zip" -Force

      - name: Upload Windows Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Windows-Client
          path: MayxCloudGaming-Windows-Client.zip
