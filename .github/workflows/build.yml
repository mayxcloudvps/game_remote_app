name: Build Mayx Cloud Gaming App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android,windows --org com.mayx.cloudgaming --app-name mayx_cloud_gaming
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows project structure if missing
        run: |
          if (-not (Test-Path "windows")) {
            flutter create . --platforms=windows --org com.mayx.cloudgaming --app-name mayx_cloud_gaming
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Windows
          path: build/windows/runner/Release/
