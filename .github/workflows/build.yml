name: Build Mayx Cloud Gaming App & Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD ANDROID CLIENT (.APK)
  # ==========================================
  build-apk:
    name: Build Android Client APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Config Files (Safe)
        run: |
          flutter create --platforms=android --org com.mayx.cloudgaming .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Android-Client
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # JOB 2: BUILD WINDOWS CLIENT (.EXE)
  # ==========================================
  build-windows-client:
    name: Build Windows Client EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop & Config
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.mayx.cloudgaming .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Client
        run: flutter build windows --release

      - name: Zip Windows Client Release
        shell: powershell
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MayxCloudGaming-Windows-Client.zip" -Force

      - name: Upload Windows Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Windows-Client
          path: MayxCloudGaming-Windows-Client.zip
