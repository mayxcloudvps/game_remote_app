name: Build Mayx Cloud Gaming App & Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD ANDROID CLIENT (.APK)
  # ==========================================
  build-apk:
    name: Build Android Client APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Cập nhật project Android lên V2 Embedding
      - name: Upgrade Android Project to V2 Embedding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.mayx .

      # Ép compileSdkVersion = 35 cho TẤT CẢ subprojects (bao gồm flutter_webrtc)
      - name: Force SDK 35 on All Android Plugins
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Android-Client
          path: build/app/outputs/flutter-apk/*.apk

  # ==========================================
  # JOB 2: BUILD WINDOWS CLIENT (.EXE)
  # ==========================================
  build-windows-client:
    name: Build Windows Client EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Client
        run: flutter build windows --release

      - name: Zip Windows Client Release
        shell: powershell
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MayxCloudGaming-Windows-Client.zip" -Force

      - name: Upload Windows Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Windows-Client
          path: MayxCloudGaming-Windows-Client.zip
