name: Build Mayx Cloud Gaming App & Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Job 1: Build App Client (.apk) cho Android
  build-apk:
    name: Build Android Client APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project Shell if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create dummy_app --platforms=android --org com.mayx.cloudgaming --project-name mayxcloud_gaming
            cp -r dummy_app/android .
            rm -rf dummy_app
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Android-Client
          path: build/app/outputs/flutter-apk/app-release.apk

  # Job 2: Build Server Windows Setup (.exe) cho PC
  build-server-exe:
    name: Build Windows Server Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mss pillow pynput vgamepad

      - name: Convert App Icon PNG to ICO
        shell: powershell
        run: |
          python -c "from PIL import Image; img = Image.open('app_icon.png'); img.save('app_icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=app_icon.ico --name "MayxServer" server.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer Package with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_script.iss

      - name: Upload Windows Server Setup
        uses: actions/upload-artifact@v4
        with:
          name: MayxCloudGaming-Windows-Server-Setup
          path: Output/MayxCloudGaming_Server_Setup.exe
